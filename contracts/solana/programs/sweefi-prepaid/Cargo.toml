[package]
name = "sweefi-prepaid"
version = "0.1.0"
description = "SweeFi Prepaid Balance — agent deposits, provider claims via cumulative call count"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sweefi_prepaid"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
