[package]
name = "sweefi-upto"
version = "0.1.0"
description = "SweeFi Upto Deposit — variable-amount payment with client-enforced ceiling"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sweefi_upto"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
borsh = { version = "1", features = ["derive"] }
