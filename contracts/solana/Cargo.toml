[workspace]
members = [
    "programs/sweefi-upto",
    "programs/sweefi-stream",
    "programs/sweefi-escrow",
    "programs/sweefi-prepaid",
]
resolver = "2"

[workspace.dependencies]
anchor-lang = "1.0.0"
anchor-spl = "1.0.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

